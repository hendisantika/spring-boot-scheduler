version: 2
updates:
  # Maven dependencies (Spring Boot parent, libraries, plugins, Maven wrapper)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    rebase-strategy: auto
    assignees:
      - hendisantika
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework*"
        update-types:
          - minor
          - patch
      maven-plugins:
        patterns:
          - "org.apache.maven*"
          - "*maven-plugin"
        update-types:
          - minor
          - patch
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    assignees:
      - hendisantika
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
